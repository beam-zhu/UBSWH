<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warehouse V8.20.39 Professional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root { --primary: #1890ff; --success: #52c41a; --danger: #ff4d4f; --extra: #b37feb; --bg: #f5f7fa; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif; margin: 0; background: var(--bg); min-height: 100vh; overflow-x: hidden; position: relative; }
        
        .bg-watermark {
            width: 90%;
            margin: 15px auto;
            text-align: center;
            color: #555;
            opacity: 0.12;
            font-size: 14px;
            font-style: italic;
            pointer-events: none;
            line-height: 1.8;
            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            padding: 10px 0;
        }

        .main-wrapper { display: flex; flex-direction: column; padding: 8px; gap: 8px; }
        .panel-right { order: 1; width: 100%; } 
        .panel-left { order: 3; width: 100%; display: flex; flex-direction: column; }
        .watermark-container { order: 2; width: 100%; }
        
        @media (min-width: 900px) { 
            .main-wrapper { flex-direction: row; height: 100vh; overflow: hidden; }
            .panel-right { flex: 4; height: 100%; overflow-y: auto; }
            .panel-left { flex: 6; height: 100%; }
            .watermark-container { position: fixed; bottom: 20px; right: 20px; width: 300px; opacity: 0.2; }
        }

        .card { background: white; border-radius: 12px; padding: 12px; border: 1px solid #e8e8e8; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 8px; }
        input { height: 44px; padding: 10px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 16px; width: 100%; background: #fafafa; margin-bottom: 8px; }
        .loc-input { height: 54px; font-size: 22px; border: 2px solid var(--primary); background: #fffbe6; color: #d46b08; }
        .sku-row { display: grid; grid-template-columns: 3fr 1.2fr; gap: 8px; margin-bottom: 4px; }
        .file-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .file-btn { border: 1px dashed #ccc; padding: 4px; border-radius: 8px; text-align: center; background: #fff; font-size: 10px; position: relative; min-height: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .file-btn input { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; }
        .status-tag { font-size: 10px; font-weight: bold; color: #bfbfbf; margin-top: 2px; }
        .ready { color: var(--success); }
        .btn { height: 54px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 18px; width: 100%; }
        .btn-save { background: var(--success); color: white; margin-top: 8px; }
        .btn-export { background: #444; color: white; height: 48px; font-size: 14px; flex-shrink: 0; margin-top: 10px; }
        
        .table-wrap { flex: 1; overflow-y: auto; background: white; border-radius: 12px; border: 1px solid #e8e8e8; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
        th, td { padding: 8px 2px; border-bottom: 1px solid #f0f0f0; text-align: center; vertical-align: middle; }
        
        .td-sku { word-break: break-all; white-space: normal; text-align: left; padding-left: 4px; font-weight: bold; font-size: 13px; }
        .td-loc { font-size: 11px; color: #666; word-break: break-all; }
        th { background: #fafafa; position: sticky; top: 0; z-index: 10; font-size: 10px; color: #555; }
        
        .row-over { background-color: #fff1f0 !important; color: #cf1322 !important; }
        .row-under { background-color: #e6f7ff !important; color: #096dd9 !important; }
        .row-extra { background-color: #f9f0ff !important; color: #531dab !important; }
        
        .status-pending { color: #aaaaaa !important; } 
        .status-active { color: #222222 !important; }   
        
        .edit-input { width: 100%; padding: 4px; border: 1px solid var(--primary); border-radius: 4px; text-align: center; font-size: 13px; background: transparent; }
        .del-btn { background: #ff7875; color: white; border: none; border-radius: 4px; padding: 4px 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body onclick="unlockAudio()">

<div class="main-wrapper">
    <div class="panel-right">
        <div class="card">
            <div class="file-grid">
                <div class="file-btn"><span>SKU</span><input type="file" accept=".csv" onchange="processFile('sku', this.files[0])"><span id="skuStat" class="status-tag">EMPTY</span></div>
                <div class="file-btn"><span>DAILY</span><input type="file" accept=".csv" onchange="processFile('check', this.files[0])"><span id="checkStat" class="status-tag">OPTIONAL</span></div>
                <div class="file-btn"><span>LOC</span><input type="file" accept=".csv" onchange="loadLocFile(this.files[0])"><span id="locStat" class="status-tag">EMPTY</span></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 8px;">
                <button onclick="clearCache()" style="font-size:10px; color:red; border:none; background:none; padding:5px; font-weight:bold;">[CLEAR CACHE]</button>
                <button onclick="recoverBackup()" style="font-size:10px; color:blue; border:none; background:none; padding:5px; font-weight:bold;">[RECOVER BACKUP]</button>
            </div>
        </div>

        <div class="card">
            <input type="text" id="opName" placeholder="Operator Name" onchange="saveLocal()">
            <div id="batchContainer">
                <div class="sku-row"><input type="text" id="s1" placeholder="SKU 1" inputmode="decimal"><input type="tel" id="q1" placeholder="Qty"></div>
                <div class="sku-row"><input type="text" id="s2" placeholder="SKU 2" inputmode="decimal"><input type="tel" id="q2" placeholder="Qty"></div>
                <div class="sku-row"><input type="text" id="s3" placeholder="SKU 3" inputmode="decimal"><input type="tel" id="q3" placeholder="Qty"></div>
                <div class="sku-row"><input type="text" id="s4" placeholder="SKU 4" inputmode="decimal"><input type="tel" id="q4" placeholder="Qty"></div>
                <div class="sku-row"><input type="text" id="s5" placeholder="SKU 5" inputmode="decimal"><input type="tel" id="q5" placeholder="Qty"></div>
                <div class="sku-row"><input type="text" id="s6" placeholder="SKU 6" inputmode="decimal"><input type="tel" id="q6" placeholder="Qty"></div>
            </div>
            <input type="text" id="locIn" list="locList" class="loc-input" placeholder="SCAN LOCATION (LOC)">
            <datalist id="locList"></datalist>
            <button class="btn btn-save" id="saveBtn" onclick="addBatch()">SAVE ALL</button>
        </div>
    </div>

    <div class="watermark-container">
        <div class="bg-watermark">
            敬畏耶和华是智慧的开端；认识至圣者便是聪明。<br>
            The fear of the LORD is the beginning of wisdom, and knowledge of the Holy One is understanding.
        </div>
    </div>

    <div class="panel-left">
        <div class="table-wrap">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th style="width: 30%;">SKU</th>
                        <th style="width: 25%;">Location</th>
                        <th style="width: 18%;">Qty</th>
                        <th style="width: 15%;">STATUS</th>
                        <th style="width: 12%;">DEL</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <button class="btn btn-export" onclick="exportCsv()">EXPORT CSV</button>
    </div>
</div>

<script>
    let dbMaster = {}, dbDaily = {}, setLoc = new Set(), data = [], dailyOrder = [];
    let dailyActive = false, audioCtx = null, forceSKU = null;

    function unlockAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    window.onload = () => {
        const cache = localStorage.getItem('wh_v820_data'), op = localStorage.getItem('wh_v820_op');
        if (cache) { data = JSON.parse(cache); }
        if (op) document.getElementById('opName').value = op;
        const cM = localStorage.getItem('csv_master'), cC = localStorage.getItem('csv_check'), cL = localStorage.getItem('csv_loc');
        if(cM) { parseSKU(cM); updateStat('skuStat', true); }
        if(cC) { parseCheck(cC); updateStat('checkStat', true); }
        if(cL) { parseLoc(cL); updateStat('locStat', true); }
        setupEnterKey();
        setTimeout(render, 300);
    };

    function processFile(t, f) {
        if(!f) return; const r = new FileReader();
        r.onload = (e) => {
            const txt = e.target.result;
            if(t==='sku') { parseSKU(txt); localStorage.setItem('csv_master', txt); updateStat('skuStat', true); render(); }
            if(t==='check') { parseCheck(txt); localStorage.setItem('csv_check', txt); updateStat('checkStat', true); }
        }; r.readAsText(f);
    }
    function loadLocFile(f) { if(!f) return; const r = new FileReader(); r.onload=(e)=>{parseLoc(e.target.result); localStorage.setItem('csv_loc',e.target.result); updateStat('locStat',true); render();}; r.readAsText(f); }
    function parseSKU(txt) { Papa.parse(txt, { complete: (res) => { dbMaster = {}; res.data.forEach((r, i) => { if(i>0 && r[0]) dbMaster[r[0].trim().toUpperCase()] = {b:r[1]||"", c:r[2]||""}; }); }}); }
    
    function parseCheck(txt) { 
        Papa.parse(txt, { complete: (res) => { 
            dbDaily = {}; dailyOrder = []; dailyActive = false; 
            res.data.forEach((r, i) => { 
                if(i > 0 && r[0]) { 
                    let k = r[0].trim().toUpperCase();
                    let q = parseFloat(r[1]) || 0;
                    if (dbDaily[k] !== undefined) { dbDaily[k] += q; } 
                    else { dbDaily[k] = q; dailyOrder.push(k); }
                    dailyActive = true; 
                } 
            }); 
            
            dailyOrder.sort((a, b) => {
                let skuA = dbMaster[a] ? dbMaster[a].b : a; let skuB = dbMaster[b] ? dbMaster[b].b : b;
                if (skuA.includes('~')) skuA = skuA.split('~').pop(); if (skuB.includes('~')) skuB = skuB.split('~').pop();
                let numA = parseFloat(skuA), numB = parseFloat(skuB);
                if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
                return skuA.localeCompare(skuB);
            });
            render();
        }}); 
    }

    function parseLoc(txt) { Papa.parse(txt, { complete: (res) => { setLoc.clear(); const dl = document.getElementById('locList'); dl.innerHTML = ""; res.data.forEach(r => r.forEach(c => { if(c && c.toString().trim()) { let v = c.toString().trim().toUpperCase(); setLoc.add(v); let o = document.createElement('option'); o.value = v; dl.appendChild(o); } })); }}); }
    function updateStat(id, r) { const s = document.getElementById(id); s.innerText = r ? "READY" : "EMPTY"; s.className = r ? "status-tag ready" : "status-tag"; }
    function clearCache() { if(confirm("Are you sure you want to clear all data and cached lists?")) { localStorage.clear(); location.reload(); } }
    function recoverBackup() { const b = localStorage.getItem('wh_v820_backup'); if(b) { data = JSON.parse(b); render(); alert("Data successfully recovered!"); } }

    function playSound(type) {
        if(!audioCtx) return;
        const g = audioCtx.createGain(); g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.connect(audioCtx.destination);
        const o = audioCtx.createOscillator();
        if(type === 'success') { o.type='sine'; o.frequency.setValueAtTime(1000, audioCtx.currentTime); o.start(); o.stop(audioCtx.currentTime + 0.1); }
        else if(type === 'warn') { o.type='square'; o.frequency.setValueAtTime(440, audioCtx.currentTime); o.start(); o.stop(audioCtx.currentTime + 0.3); }
        else { o.type='sawtooth'; o.frequency.setValueAtTime(150, audioCtx.currentTime); o.start(); o.stop(audioCtx.currentTime + 0.4); }
    }

    function addBatch() {
        unlockAudio();
        const lv = document.getElementById('locIn').value.trim().toUpperCase();
        const op = document.getElementById('opName').value.trim();
        if(!lv || !op) { playSound('error'); return; }
        if (setLoc.size > 0 && !setLoc.has(lv)) { playSound('error'); return; }

        let batch = [], any = false, mismatch = false;
        const dateStr = new Date().toISOString().slice(0,10).replace(/-/g, "");

        for(let i=1; i<=6; i++) {
            const sv = document.getElementById('s'+i).value.trim().toUpperCase();
            const qv = parseFloat(document.getElementById('q'+i).value);
            if(!sv) continue;
            if(dailyActive && dbDaily[sv] === undefined && forceSKU !== sv) { mismatch = true; forceSKU = sv; break; }
            if(!qv || qv <= 0) { playSound('error'); return; }
            any = true;

            batch.push({ 
                id: Date.now() + "_" + i + "_" + Math.random().toString(36).substr(2, 5), 
                _originSKU: sv, 
                SKU: dbMaster[sv]?dbMaster[sv].b:sv, Name: dbMaster[sv]?dbMaster[sv].c:"N/A", 
                Quantity: qv, Location: lv, FullLocation: "Patiki Warehouse: " + lv, Date: dateStr 
            });
        }

        if(mismatch) {
            playSound('error'); const b = document.getElementById('saveBtn'); b.innerText = "SKU NOT IN LIST! TAP AGAIN TO FORCE SAVE"; b.style.background = "orange";
            setTimeout(() => { b.innerText = "SAVE ALL"; b.style.background = ""; forceSKU = null; }, 3000);
            return;
        }
        if(!any) return;
        data = [...data, ...batch]; render(); saveLocal(); 
        
        let hasOver = false;
        let totals = {}; data.forEach(d => totals[d._originSKU] = (totals[d._originSKU] || 0) + d.Quantity);
        batch.forEach(b => { if(dailyActive && dbDaily[b._originSKU] && totals[b._originSKU] > dbDaily[b._originSKU]) hasOver = true; });
        playSound(hasOver ? 'warn' : 'success');

        for(let i=1; i<=6; i++) { document.getElementById('s'+i).value = ""; document.getElementById('q'+i).value = ""; }
        document.getElementById('locIn').value = ""; document.getElementById('s1').focus();
        forceSKU = null;
    }

    function render() {
        const tbody = document.querySelector("#mainTable tbody"); tbody.innerHTML = "";
        let realSkuTotals = {};
        data.forEach(d => { realSkuTotals[d._originSKU] = (realSkuTotals[d._originSKU] || 0) + d.Quantity; });

        let localMergedScans = {};
        data.forEach(d => {
            let comboKey = d._originSKU + "##" + d.Location;
            if (localMergedScans[comboKey]) {
                localMergedScans[comboKey].quantity += d.Quantity;
                localMergedScans[comboKey].rawIds.push(d.id);
            } else {
                localMergedScans[comboKey] = {
                    _originSKU: d._originSKU, SKU: d.SKU, location: d.Location,
                    quantity: d.Quantity, rawIds: [d.id], hasInput: true
                };
            }
        });

        let allDisplayRows = [];
        let trackedDailyKeysWithInput = new Set();

        Object.keys(localMergedScans).forEach(key => {
            let scanItem = localMergedScans[key];
            let k = scanItem._originSKU;
            let plan = dbDaily[k];
            let skuTotal = realSkuTotals[k] || 0;

            let diffText = "OK"; let isException = false; let rowClass = "";
            
            if (plan === undefined) { diffText = "EXT"; isException = true; rowClass = "row-extra"; } 
            else {
                trackedDailyKeysWithInput.add(k);
                if (skuTotal > plan) { diffText = "+" + (skuTotal - plan); isException = true; rowClass = "row-over"; } 
                else if (skuTotal < plan) { diffText = (total => (skuTotal - plan).toString())(); isException = true; rowClass = "row-under"; }
            }

            let displaySKU = scanItem.SKU;
            if (displaySKU.includes('~')) displaySKU = displaySKU.split('~').pop();

            allDisplayRows.push({
                _originSKU: k, displaySKU: displaySKU, location: scanItem.location,
                quantity: scanItem.quantity, diffText: diffText, isException: isException,
                rowClass: rowClass, hasInput: true, rawIds: scanItem.rawIds
            });
        });

        if (dailyActive) {
            dailyOrder.forEach(k => {
                if (trackedDailyKeysWithInput.has(k)) return;
                let plan = dbDaily[k];
                let displaySKU = dbMaster[k] ? dbMaster[k].b : k;
                if (displaySKU.includes('~')) displaySKU = displaySKU.split('~').pop();

                allDisplayRows.push({
                    _originSKU: k, displaySKU: displaySKU, location: "—",
                    quantity: 0, diffText: (-plan).toString(), isException: true,
                    rowClass: "row-under", hasInput: false, rawIds: []
                });
            });
        }

        allDisplayRows.sort((a, b) => {
            if (!dailyActive) return 0;
            if (a.isException && !b.isException) return -1;
            if (!a.isException && b.isException) return 1;
            let numA = parseFloat(a.displaySKU), numB = parseFloat(b.displaySKU);
            if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
            return a.displaySKU.localeCompare(b.displaySKU);
        });

        allDisplayRows.forEach(item => {
            let tr = document.createElement('tr');
            tr.className = item.rowClass;
            let fontStyleClass = item.hasInput ? "status-active" : "status-pending";
            tr.classList.add(fontStyleClass);

            let qtyCellHtml = item.hasInput 
                ? `<input type="number" class="edit-input" value="${item.quantity}" onchange="updateLocationGroupQty('${item._originSKU}', '${item.location}', this.value)">`
                : `<span style="font-size:13px;">0</span> <span style="font-size:10px;color:#aaa;">(Plan:${dbDaily[item._originSKU]})</span>`;

            // --- 核心致命修复：彻底停用 onclick，全面换用更高优先级的 onmousedown 鼠标瞬间按下拦截技术 ---
            let delCellHtml = item.hasInput 
                ? `<button class="del-btn" onmousedown="deleteLocationGroup(event, '${JSON.stringify(item.rawIds)}')">×</button>` 
                : "—";

            tr.innerHTML = `
                <td class="td-sku">${item.displaySKU}</td>
                <td class="td-loc">${item.location}</td>
                <td>${qtyCellHtml}</td>
                <td style="font-weight:bold; font-size:11px;">${item.diffText}</td>
                <td>${delCellHtml}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateLocationGroupQty(originSKU, location, newQtyStr) {
        let n = parseFloat(newQtyStr);
        if (n >= 0) {
            data = data.filter(x => !(x._originSKU === originSKU && x.Location === location));
            if (n > 0) {
                const dateStr = new Date().toISOString().slice(0,10).replace(/-/g, "");
                data.push({
                    id: Date.now() + "_" + Math.random().toString(36).substr(2, 5),
                    _originSKU: originSKU,
                    SKU: dbMaster[originSKU] ? dbMaster[originSKU].b : originSKU,
                    Name: dbMaster[originSKU] ? dbMaster[originSKU].c : "N/A",
                    Quantity: n, Location: location, FullLocation: "Patiki Warehouse: " + location, Date: dateStr
                });
            }
            render(); saveLocal();
        }
    }

    // --- 核心机制升级：在 mousedown 阶段第一时间截断失焦动作并闪击清除数据 ---
    function deleteLocationGroup(e, rawIdsJsonStr) {
        if (e) {
            e.stopPropagation(); // 阻断一切冒泡
            e.preventDefault();  // 强行阻止电脑端浏览器的失焦重配与渲染
        }
        let idsToRemove = JSON.parse(rawIdsJsonStr);
        if (confirm("Are you sure you want to delete this specific location record?")) {
            data = data.filter(x => !idsToRemove.includes(x.id));
            render(); saveLocal();
        }
    }

    function saveLocal() { 
        localStorage.setItem('wh_v820_data', JSON.stringify(data)); 
        localStorage.setItem('wh_v820_op', document.getElementById('opName').value); 
        localStorage.setItem('wh_v820_backup', JSON.stringify(data));
    }
    
    function exportCsv() {
        if(!data.length) return;
        let ts = {}; data.forEach(d => ts[d._originSKU] = (ts[d._originSKU] || 0) + d.Quantity);
        const op = document.getElementById('opName').value.trim() || "User", dateNow = new Date().toISOString().slice(0,10).replace(/-/g, "");
        const csv = Papa.unparse([
            ["SKU","Name","BatchSerialNumber","SupplierSKU","ExpiryDate_YYYYMMDD","Quantity","Location","DateReceived_YYYYMMDD","Received","Exception_Note"], 
            ...data.map(d => {
                const p = dbDaily[d._originSKU], t = ts[d._originSKU];
                let note = "";
                if (dailyActive) {
                    if (p === undefined) note = "NOT IN LIST";
                    else if (t > p) note = "+" + (t - p);
                    else if (t < p) note = (t - p);
                }
                return [d.SKU, d.Name, "", "", "", d.Quantity, d.FullLocation, d.Date, "TRUE", note];
            })
        ]);
        const b = new Blob(["\ufeff"+csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `Putway_${op}_${dateNow}.csv`; a.click();
    }
    
    function setupEnterKey() {
        const ins = Array.from(document.querySelectorAll('.panel-right input'));
        ins.forEach((input, index) => { input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); (ins[index + 1] || ins[0]).focus(); if(input.id === 'locIn') addBatch(); } }); });
    }
</script>
</body>
</html>

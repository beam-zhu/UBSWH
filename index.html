<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Warehouse V8.20.3 Focus-Final</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root { --primary: #1890ff; --success: #52c41a; --danger: #ff4d4f; --bg: #f5f7fa; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); min-height: 100vh; }

        /* 布局锁定：手机端模式 */
        .main-wrapper { display: flex; flex-direction: column; padding: 10px; gap: 10px; }
        .panel-right { order: 1; } 
        .panel-left { order: 2; }

        /* 电脑/平板横屏：右手模式锁定 */
        @media (min-width: 900px) { 
            .main-wrapper { flex-direction: row; height: 100vh; overflow: hidden; }
            .panel-left { flex: 5; height: 100%; display: flex; flex-direction: column; order: 1; }
            .panel-right { flex: 5; height: 100%; display: flex; flex-direction: column; overflow-y: auto; order: 2; }
            body { overflow: hidden; }
        }

        .card { background: white; border-radius: 12px; padding: 15px; border: 1px solid #e8e8e8; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 10px; }
        label { font-size: 11px; color: #8c8c8c; font-weight: bold; margin-bottom: 4px; display: block; }
        input { height: 38px; padding: 8px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 15px; width: 100%; background: #fafafa; margin-bottom: 8px; }
        input:focus { border-color: var(--primary); outline: none; background: white; border-width: 2px; }
        .loc-input { height: 50px; font-size: 20px; font-weight: bold; border: 2px solid #1890ff; background: #fffbe6; color: #d46b08; }
        .sku-row { display: grid; grid-template-columns: 3fr 1fr; gap: 8px; margin-bottom: 2px; align-items: center; }
        .file-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
        .file-btn { border: 1px dashed #ccc; padding: 4px; border-radius: 6px; text-align: center; background: #fff; font-size: 9px; }
        .status { font-size: 9px; font-weight: bold; color: #bfbfbf; }
        .ready { color: var(--success); }
        .btn { height: 52px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 18px; width: 100%; }
        .btn-save { background: var(--success); color: white; margin-top: 5px; }
        .btn-export { background: #444; color: white; margin: 15px 0; height: 45px; font-size: 14px; flex-shrink: 0; }
        .table-wrap { flex: 1; padding: 0 10px; }
        @media (min-width: 900px) { .table-wrap { overflow-y: auto; } }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 8px; border-bottom: 1px solid #f0f0f0; text-align: left; }
        th { background: #fafafa; position: sticky; top: 0; z-index: 10; }
        .row-over { background-color: #fff1f0 !important; color: #ff4d4f !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="panel-left">
        <h3 style="padding: 12px 15px 5px; margin: 0; font-size: 15px;">PUTWAY LIST (录入清单)</h3>
        <div class="table-wrap">
            <table id="mainTable">
                <thead><tr><th>SKU</th><th>QTY</th><th>LOCATION</th><th>STATUS</th><th>ACT</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div style="padding: 0 15px;"><button class="btn btn-export" onclick="exportCsv()">EXPORT CSV</button></div>
    </div>

    <div class="panel-right">
        <div class="card" style="padding: 8px;">
            <div class="file-grid">
                <div class="file-btn"><label>MASTER</label><input type="file" id="skuFile" accept=".csv" onchange="loadSKU()"><span id="skuStat" class="status">EMPTY</span></div>
                <div class="file-btn"><label>DAILY</label><input type="file" id="checkFile" accept=".csv" onchange="loadCheck()"><span id="checkStat" class="status">OPTIONAL</span></div>
                <div class="file-btn"><label>LOC</label><input type="file" id="locFile" accept=".csv" onchange="loadLoc()"><span id="locStat" class="status">EMPTY</span></div>
            </div>
        </div>

        <div class="card">
            <label>OPERATOR 操作员</label>
            <input type="text" id="opName" placeholder="Name" onchange="saveLocal()" style="margin-bottom:12px; height: 40px;">
            
            <label>SKU & QTY (1-6 ITEMS)</label>
            <div id="batchContainer">
                <div class="sku-row"><span>SKU CODE</span><span>QTY</span></div>
                <div class="sku-row"><input type="text" id="s1" class="sku-f" placeholder="1st SKU"><input type="tel" id="q1" class="qty-f" value="1"></div>
                <div class="sku-row"><input type="text" id="s2" class="sku-f" placeholder="2nd SKU"><input type="tel" id="q2" class="qty-f" value="1"></div>
                <div class="sku-row"><input type="text" id="s3" class="sku-f" placeholder="3rd SKU"><input type="tel" id="q3" class="qty-f" value="1"></div>
                <div class="sku-row"><input type="text" id="s4" class="sku-f" placeholder="4th SKU"><input type="tel" id="q4" class="qty-f" value="1"></div>
                <div class="sku-row"><input type="text" id="s5" class="sku-f" placeholder="5th SKU"><input type="tel" id="q5" class="qty-f" value="1"></div>
                <div class="sku-row"><input type="text" id="s6" class="sku-f" placeholder="6th SKU"><input type="tel" id="q6" class="qty-f" value="1"></div>
            </div>

            <div style="margin-top: 10px;">
                <label>COMMON LOCATION 库位 (Scan Last)</label>
                <input type="text" id="locIn" list="locList" class="loc-input" placeholder="Scan FINAL Location" autocorrect="off" autocapitalize="characters">
                <datalist id="locList"></datalist>
            </div>
            <button class="btn btn-save" onclick="addBatch()">SAVE ALL (保存并重置)</button>
        </div>
    </div>
</div>

<script>
    let dbMaster = {}, dbDaily = {}, setLoc = new Set(), data = [];
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    window.onload = () => {
        const cache = localStorage.getItem('wh_v820_data');
        const op = localStorage.getItem('wh_v820_op');
        if (cache) { data = JSON.parse(cache); render(); }
        if (op) document.getElementById('opName').value = op;
        setupEnterKey();
        document.getElementById('s1').focus();
    };

    function playSound(type) {
        const g = audioCtx.createGain(); g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.connect(audioCtx.destination);
        const freq = type === 'error' ? 880 : 440;
        const dur = type === 'error' ? 0.1 : 0.8;
        const o = audioCtx.createOscillator(); o.type='square'; o.frequency.value = freq;
        o.connect(g); o.start(); o.stop(audioCtx.currentTime + dur);
        if(type === 'error') { setTimeout(() => { const o2 = audioCtx.createOscillator(); o2.type='square'; o2.frequency.value = freq; o2.connect(g); o2.start(); o2.stop(audioCtx.currentTime + dur); }, 150); }
    }

    function loadSKU() { Papa.parse(document.getElementById('skuFile').files[0], { complete: (res) => {
        dbMaster = {}; res.data.forEach((r, i) => { if(i>0 && r[0]) dbMaster[r[0].trim().toUpperCase()] = {b:r[1]||"", c:r[2]||""}; });
        const s = document.getElementById('skuStat'); s.innerText = "READY"; s.className="status ready";
    }});}
    function loadCheck() { Papa.parse(document.getElementById('checkFile').files[0], { complete: (res) => {
        dbDaily = {}; res.data.forEach(r => { if(r[0]) dbDaily[r[0].trim().toUpperCase()] = parseFloat(r[1]) || 0; });
        const s = document.getElementById('checkStat'); s.innerText = "READY"; s.className="status ready";
    }});}
    function loadLoc() { Papa.parse(document.getElementById('locFile').files[0], { complete: (res) => {
        setLoc.clear(); const dl = document.getElementById('locList'); dl.innerHTML = "";
        res.data.forEach(r => r.forEach(c => { if(c && c.trim().length > 1) { let v = c.trim().toUpperCase(); setLoc.add(v); let o = document.createElement('option'); o.value = v; dl.appendChild(o); } }));
        const s = document.getElementById('locStat'); s.innerText = "READY"; s.className="status ready";
    }});}

    function addBatch() {
        const lv = document.getElementById('locIn').value.trim().toUpperCase();
        const op = document.getElementById('opName').value.trim();
        const now = new Date();
        const dateStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
        if(!lv || !op) { alert("Loc & Name Required!"); return; }
        if (setLoc.size > 0 && !setLoc.has(lv)) { playSound('error'); return; }

        let counts = {};
        for(let i=1; i<=6; i++) {
            const sv = document.getElementById('s'+i).value.trim().toUpperCase();
            const qv = parseFloat(document.getElementById('q'+i).value) || 0;
            if(sv) counts[sv] = (counts[sv] || 0) + qv;
        }

        let batch = [], any = false;
        for(let i=1; i<=6; i++) {
            const sv = document.getElementById('s'+i).value.trim().toUpperCase();
            const qv = parseFloat(document.getElementById('q'+i).value);
            if(!sv) continue;
            any = true;
            const m = dbMaster[sv];
            const plan = dbDaily[sv] || 0;
            const saved = data.filter(d => d._originSKU === sv).reduce((sum, d) => sum + parseFloat(d.Quantity), 0);
            const isOver = Object.keys(dbDaily).length > 0 && plan > 0 && (saved + counts[sv]) > plan;
            if(isOver) playSound('warn');
            batch.push({ id: Date.now()+i, _originSKU: sv, "SKU": m?m.b:sv, "Name": m?m.c:"N/A", "Quantity": qv, "Location": "Patiki Warehouse: "+lv, "DateReceived": dateStr, "Status": isOver ? "!!OVER!!" : "OK" });
        }
        if(!any) return;
        data = [...batch, ...data]; render(); saveLocal();
        for(let i=1; i<=6; i++) { document.getElementById('s'+i).value = ""; document.getElementById('q'+i).value = "1"; }
        document.getElementById('locIn').value = ""; document.getElementById('s1').focus();
    }

    function render() {
        const b = document.querySelector("#mainTable tbody"); b.innerHTML = "";
        data.forEach(d => {
            const isRed = d.Status.includes("OVER");
            b.innerHTML += `<tr ${isRed ? 'class="row-over"' : ''}><td><b>${d.SKU}</b></td><td>${d.Quantity}</td><td>${d.Location.replace('Patiki Warehouse: ', '')}</td><td>${d.Status}</td><td><button style="background:#ff7875;color:white;border:none;border-radius:4px;padding:4px 8px;" onclick="del(${d.id})">DEL</button></td></tr>`;
        });
    }

    function del(id) { if(confirm("Del?")) { data = data.filter(x => x.id !== id); render(); saveLocal(); } }
    function saveLocal() { localStorage.setItem('wh_v820_data', JSON.stringify(data)); localStorage.setItem('wh_v820_op', document.getElementById('opName').value); }
    
    function exportCsv() {
        if(!data.length) return;
        const op = document.getElementById('opName').value.trim() || "User";
        const csv = Papa.unparse([["SKU","Name","BatchSerialNumber","SupplierSKU","ExpiryDate_YYYYMMDD","Quantity","Location","DateReceived_YYYYMMDD","Received"], ...data.map(d => [d.Status.includes("OVER") ? `>>> OVER: [${d.SKU}] <<<` : d.SKU, d.Name, "","","", d.Quantity, d.Location, d.DateReceived, "TRUE"])]);
        const blob = new Blob(["\ufeff"+csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
        link.download = `Putway_${op}_${new Date().toISOString().slice(0,10)}.csv`; link.click();
    }

    function setupEnterKey() {
        const inputs = Array.from(document.querySelectorAll('.panel-right input'));
        inputs.forEach((input, index) => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const next = inputs[index + 1] || inputs[0];
                    
                    // --- 手机端光标后置核心补丁 ---
                    if (next.classList.contains('qty-f')) {
                        const val = next.value;
                        next.value = ''; // 先清空
                        next.focus();
                        setTimeout(() => {
                            next.value = val; // 延迟填入，光标必在最后
                        }, 50);
                    } else {
                        next.focus();
                    }
                    
                    if(input.id === 'locIn') addBatch();
                }
            });
        });
    }
</script>
</body>
</html>

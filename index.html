<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warehouse var.29.30 Anti-Duplicate Guard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root { --primary: #1890ff; --success: #52c41a; --danger: #ff4d4f; --extra: #b37feb; --bg: #f5f7fa; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif; margin: 0; background: var(--bg); min-height: 100vh; overflow-x: hidden; position: relative; }
        
        .main-wrapper { display: flex; flex-direction: column; padding: 8px; gap: 8px; }
        .panel-right { order: 1; width: 100%; } 
        .panel-left { order: 2; width: 100%; display: flex; flex-direction: column; }
        
        @media (min-width: 900px) { 
            .main-wrapper { flex-direction: row; height: 100vh; overflow: hidden; }
            .panel-right { flex: 4; height: 100%; overflow-y: auto; }
            .panel-left { flex: 6; height: 100%; }
        }
        .card { background: white; border-radius: 12px; padding: 12px; border: 1px solid #e8e8e8; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 8px; }
        input, select { height: 44px; padding: 10px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 16px; width: 100%; background: #fafafa; margin-bottom: 8px; }
        .loc-input { height: 54px; font-size: 22px; border: 2px solid var(--primary); background: #fffbe6; color: #d46b08; }
        .sku-row { display: grid; grid-template-columns: 3fr 1.2fr; gap: 8px; margin-bottom: 4px; }
        
        .select-daily-box {
            height: 46px; font-size: 15px; font-weight: bold; color: #1890ff;
            background: #e6f7ff; border: 2px solid #91d5ff; border-radius: 8px;
            cursor: pointer; text-align: center;
        }

        .status-tag { font-size: 10px; font-weight: bold; color: #bfbfbf; margin-top: 2px; word-break: break-all; padding: 0 4px; text-align: center; }
        .ready { color: var(--success); }
        .btn { height: 54px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 18px; width: 100%; }
        .btn-save { background: var(--success); color: white; margin-top: 8px; }
        .btn-save:disabled { background: #d9d9d9 !important; color: #8c8c8c !important; cursor: not-allowed; }
        .btn-export { background: #444; color: white; height: 48px; font-size: 14px; flex-shrink: 0; margin-top: 10px; }
        
        .table-wrap { flex: 1; overflow-y: auto; background: white; border-radius: 12px; border: 1px solid #e8e8e8; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
        th, td { padding: 8px 2px; border-bottom: 1px solid #f0f0f0; text-align: center; vertical-align: middle; }
        .td-sku { word-break: break-all; white-space: normal; text-align: left; padding-left: 4px; font-weight: bold; font-size: 13px; }
        .td-loc { font-size: 11px; color: #666; word-break: break-all; }
        th { background: #fafafa; position: sticky; top: 0; z-index: 10; font-size: 10px; color: #555; }
        
        .row-over { background-color: #fff1f0 !important; color: #cf1322 !important; }
        .row-under { background-color: #e6f7ff !important; color: #096dd9 !important; }
        .row-extra { background-color: #f9f0ff !important; color: #531dab !important; }
        .status-pending { color: #aaaaaa !important; } 
        .status-active { color: #222222 !important; }   
        .edit-input { width: 100%; padding: 4px; border: 1px solid var(--primary); border-radius: 4px; text-align: center; font-size: 13px; background: transparent; }
        .del-btn { background: #ff7875; color: white; border: none; border-radius: 4px; padding: 4px 8px; font-weight: bold; cursor: pointer; }
        .cloud-banner { padding: 6px; border-radius: 8px; font-size: 11px; text-align: center; margin-bottom: 4px; font-weight: bold; }
        .cb-sku { background: #e6f7ff; border: 1px solid #91d5ff; color: #0050b3; }
        .cb-loc { background: #feffe6; border: 1px solid #fffb8f; color: #614700; }
        .cb-sync { background: #f6ffed; border: 1px solid #b7eb8f; color: #52c41a; }
        .cb-daily { background: #f9f0ff; border: 1px solid #d3ade6; color: #531dab; }
    </style>
</head>
<body onclick="unlockAudio()">

<div class="main-wrapper">
    <div class="panel-right">
        <div class="cloud-banner cb-sku" id="cloudStat">☁️ 联动双主库安全引擎正在连接...</div>
        <div class="cloud-banner cb-loc" id="locCloudStat">☁️ 公司库位表 (A-U列) 正在连接...</div>
        <div class="cloud-banner cb-daily" id="dailyCloudStat">☁️ 正在一次性拉取云端所有柜号 JSON...</div>
        <div class="cloud-banner cb-sync" id="networkStat">📡 多端联网对齐中...</div>

        <div class="card">
            <select id="sheetContainerSelector" class="select-daily-box" onchange="onContainerSheetChange(this.value)">
                <option value="">🚢 正在一键加载云端全量柜号...</option>
            </select>

            <div style="display: flex; justify-content: space-between; margin-top: 8px;">
                <button onclick="clearScreenPureHistory()" style="font-size:10px; color:#1890ff; border:1px solid #1890ff; border-radius:4px; background:none; padding:5px; font-weight:bold;">[CLEAR SCREEN] (清空屏幕历史)</button>
                <button onclick="recoverBackup()" style="font-size:10px; color:blue; border:1px solid blue; border-radius:4px; background:none; padding:5px; font-weight:bold;">[RECOVER BACKUP]</button>
            </div>
        </div>

        <div class="card">
            <input type="text" id="opName" placeholder="Operator Name (开工必填)" onchange="saveLocalNameOnly()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <div id="batchContainer">
                <div class="sku-row"><input type="text" id="s1" placeholder="SKU 1" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><input type="tel" id="q1" placeholder="Qty" autocomplete="off"></div>
                <div class="sku-row"><input type="text" id="s2" placeholder="SKU 2" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><input type="tel" id="q2" placeholder="Qty" autocomplete="off"></div>
                <div class="sku-row"><input type="text" id="s3" placeholder="SKU 3" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><input type="tel" id="q3" placeholder="Qty" autocomplete="off"></div>
                <div class="sku-row"><input type="text" id="s4" placeholder="SKU 4" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><input type="tel" id="q4" placeholder="Qty" autocomplete="off"></div>
                <div class="sku-row"><input type="text" id="s5" placeholder="SKU 5" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><input type="tel" id="q5" placeholder="Qty" autocomplete="off"></div>
                <div class="sku-row"><input type="text" id="s6" placeholder="SKU 6" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><input type="tel" id="q6" placeholder="Qty" autocomplete="off"></div>
            </div>
            <input type="text" id="locIn" list="locList" class="loc-input" placeholder="SCAN LOCATION (LOC)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <datalist id="locList"></datalist>
            <button class="btn btn-save" id="saveBtn" onclick="addBatch()">SAVE ALL</button>
        </div>
    </div>

    <div class="panel-left">
        <div class="table-wrap">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th style="width: 30%;">SKU</th>
                        <th style="width: 25%;">Location</th>
                        <th style="width: 18%;">Qty</th>
                        <th style="width: 15%;">STATUS</th>
                        <th style="width: 12%;">DEL</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <button class="btn btn-export" onclick="exportCsv()">EXPORT CSV</button>
    </div>
</div>

<script>
    const FILE1_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR8x1PYnDYTCIvzG5qoq_syoxgAJ4m6FGoMJb6W9bEQ-HwUVCiJV7PGkR8o80qT7r6I_GkL4cgWguvw/pub?gid=1763823264&single=true&output=csv";
    const FILE2_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQBh1fAm0-5pIJyHCRVDTt_n3vYILct87elf6_dJ9KvtZ126d-LYsgVkEaGKaZmti9lvFByG5LIc1dR/pub?gid=326617304&single=true&output=csv";
    const FIXED_LOC_CLOUD_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vStLtLccpDSfrf_yU_T9WrNcZufN29BqkDsVS2r9ql1INK_61uA8UetkiW4DZ4_dv63o-DHzFz0tOAq/pub?gid=1276542862&single=true&output=csv";
    
    // ⚡ 一次性 JSON 打包 Web API 接口
    const BATCH_WEB_API_URL = "https://script.google.com/macros/s/AKfycbyQT2pvRXzyy02dYzvBEITy4AIJA_TTv130JkIvzQIl-FI6e1lJNOrme4wRqxJFTBmvOA/exec";
    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyuwspiWzxRItdBNEh4rXkmUnY0W914I0CApzWAYNO0GtHWaOYovGAh96usIlr43sC5rA/exec";

    let auditLogPool = [];
    let dbMaster = {}, dbDailyList = [], setLoc = new Set(), dbLocMap = {}, data = [];
    let dailyActive = false, audioCtx = null, forceSKU = null;
    let isUserTyping = false;
    let currentSelectedSheetName = "";
    
    // 全局内存 JSON 数据库
    let globalAllCabinetsStore = {};
    
    let lastSubmitTime = 0;

    function unlockAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function getTodayDateStr() {
        const t = new Date();
        return `${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}`;
    }

    window.onload = () => {
        const op = localStorage.getItem('wh_v820_op'), cachedLocsText = localStorage.getItem('wh_v825_cached_locs'), localLogs = localStorage.getItem('wh_v828_audit_logs');
        if (op) document.getElementById('opName').value = op;
        if (cachedLocsText) { buildLocationsEngine(cachedLocsText, true); }
        if (localLogs) { auditLogPool = JSON.parse(localLogs); }
        
        fetchCloudMasterDualChannels();
        fetchCloudLocations();
        
        // ⚡ 一次性极速加载全量柜号 JSON
        fetchAllContainerSheetsOnce();
        
        syncNetworkPool();
        setInterval(syncNetworkPool, 5000); 
        
        setupFocusListeners();
    };

    function setupFocusListeners() {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => { isUserTyping = true; });
            input.addEventListener('blur', () => { 
                setTimeout(() => {
                    const activeElement = document.activeElement;
                    if (!activeElement || activeElement.tagName !== 'INPUT') {
                        isUserTyping = false;
                    }
                }, 300);
            });
        });
    }

    // ⚡ 批量 JSON 极速抓取引擎
    async function fetchAllContainerSheetsOnce() {
        const banner = document.getElementById('dailyCloudStat');
        banner.innerText = "🚀 正在一次性提取全量柜号 JSON 数据包...";

        try {
            const res = await fetch(BATCH_WEB_API_URL + "?t=" + Date.now());
            const json = await res.json();

            if (json.status === "success" && json.data) {
                globalAllCabinetsStore = json.data;
                const sheetNames = Object.keys(globalAllCabinetsStore);

                if (sheetNames.length > 0) {
                    updateContainerDropdownUI(sheetNames);
                    banner.innerText = `⚡ 动态柜号库秒级装载完成 (已打包载入 ${sheetNames.length} 个柜号)`;
                    banner.style.background = "#f9f0ff"; banner.style.borderColor = "#d3ade6"; banner.style.color = "#531dab";
                } else {
                    banner.innerText = "⚠️ 未获取到柜号标签页";
                }
            } else {
                banner.innerText = "⚠️ 获取数据失败: " + (json.message || "格式不匹配");
            }
        } catch (err) {
            console.error("批量抓取全量数据失败:", err);
            banner.innerText = "❌ 提取云端柜号 JSON 失败，请检查网络或部署状态";
        }
    }

    function updateContainerDropdownUI(sheetNames) {
        const selector = document.getElementById('sheetContainerSelector');
        let savedSelected = localStorage.getItem('wh_selected_container_sheet') || sheetNames[0];
        
        selector.innerHTML = "";
        sheetNames.forEach(name => {
            let opt = document.createElement('option');
            opt.value = name;
            opt.innerText = `📦 柜号 / 工作表: [ ${name} ]`;
            selector.appendChild(opt);
        });

        if (sheetNames.includes(savedSelected)) {
            selector.value = savedSelected;
            currentSelectedSheetName = savedSelected;
        } else if (sheetNames.length > 0) {
            selector.value = sheetNames[0];
            currentSelectedSheetName = sheetNames[0];
        }

        parseLocalSheetData(currentSelectedSheetName);
    }

    function onContainerSheetChange(sheetName) {
        if (!sheetName) return;
        currentSelectedSheetName = sheetName;
        localStorage.setItem('wh_selected_container_sheet', sheetName);
        
        parseLocalSheetData(sheetName);
    }

    // ⚡ 本地内存 0 毫秒秒切解析
    function parseLocalSheetData(sheetName) {
        const banner = document.getElementById('dailyCloudStat');
        dbDailyList = [];
        dailyActive = false;

        const rawRows = globalAllCabinetsStore[sheetName];

        if (rawRows && Array.isArray(rawRows)) {
            for (let i = 1; i < rawRows.length; i++) {
                let row = rawRows[i];
                if (!row || row.length === 0) continue;

                let poVal = row[0] ? String(row[0]).trim() : "";
                let skuVal = row[1] ? String(row[1]).trim().toUpperCase() : "";
                let planVal = row[2] ? parseFloat(row[2]) || 0 : 0;

                if (skuVal) {
                    dbDailyList.push({ po: poVal, sku: skuVal, plan: planVal, idx: i });
                    dailyActive = true;
                }
            }
            banner.innerText = `⚡ 柜号 [${sheetName}] 挂载成功 (精准载入 ${dbDailyList.length} 项计划项)`;
        } else {
            banner.innerText = `⚠️ 柜号 [${sheetName}] 未找到有效比对数据`;
        }
        render();
    }

    function fetchLocalTimeFormatted() {
        const t = new Date();
        return `[${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}]`;
    }

    function syncNetworkPool() {
        var script = document.createElement("script");
        script.src = APP_SCRIPT_URL + (APP_SCRIPT_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
        script.id = "jsonp_sync_script";
        var oldScript = document.getElementById("jsonp_sync_script");
        if(oldScript) oldScript.parentNode.removeChild(oldScript);
        document.getElementsByTagName("head")[0].appendChild(script);
    }

    window.jsonpCallback = function(response) {
        const netBanner = document.getElementById('networkStat');
        let rawData = [];
        if (response && response.pool !== undefined) { rawData = response.pool; } 
        else if (Array.isArray(response)) { data = response; } 
        else { return; }
        
        let todayStr = getTodayDateStr();
        data = rawData.filter(d => d.Date === todayStr);
        
        refreshHistoricalDataNames();
        
        if (!isUserTyping) {
            requestAnimationFrame(() => { render(); });
        }
        
        netBanner.innerText = `📡 多端联网在线中 (今日已聚合流水: ${data.length} 条)`;
        netBanner.style.background = "#f6ffed"; netBanner.style.borderColor = "#b7eb8f"; netBanner.style.color = "#52c41a";
    };

    function sendJsonpAction(params) {
        var paramsStr = "";
        for (var key in params) { paramsStr += "&" + key + "=" + encodeURIComponent(params[key]); }
        var url = APP_SCRIPT_URL + (APP_SCRIPT_URL.includes("?") ? "" : "?") + paramsStr + "&t=" + Date.now();
        var script = document.createElement("script"); script.src = url; script.id = "jsonp_action_script";
        var oldScript = document.getElementById("jsonp_action_script");
        if(oldScript) oldScript.parentNode.removeChild(oldScript);
        document.getElementsByTagName("head")[0].appendChild(script);
    }

    function fetchCloudLocations() {
        const banner = document.getElementById('locCloudStat');
        fetch(FIXED_LOC_CLOUD_URL).then(res => res.text()).then(txt => {
            if (txt && txt.trim().length > 10) { localStorage.setItem('wh_v825_cached_locs', txt); buildLocationsEngine(txt, false); }
        }).catch(err => { banner.innerText = "⚠️ 库位离线中"; });
    }

    function buildLocationsEngine(text, isOfflineCache) {
        setLoc.clear(); dbLocMap = {}; const dl = document.getElementById('locList'); dl.innerHTML = "";
        let items = text.split(/[ \t]*[\n\r,;]+[ \t]*/); let validCount = 0;
        const blackList = ["LOCATION", "库位", "SKU", "QUANTITY", "数量", "NAME", "名称", "表头", "A", "B", "C", "U"];
        
        const fragment = document.createDocumentFragment();
        items.forEach(item => {
            let rawV = item.trim(); let upperV = rawV.toUpperCase();
            if (rawV && rawV.length >= 2 && !blackList.includes(upperV)) { 
                if(!setLoc.has(upperV)) { 
                    setLoc.add(upperV); dbLocMap[upperV] = rawV; 
                    let o = document.createElement('option'); 
                    o.setAttribute('value', rawV); 
                    fragment.appendChild(o); 
                    validCount++; 
                }
            }
        });
        dl.appendChild(fragment);

        const banner = document.getElementById('locCloudStat');
        if (isOfflineCache) { banner.innerText = `📦 本地内置库位就绪 (已锁死: ${validCount} 个库位联想)`; } 
        else { banner.innerText = `⚡ 公司库位表 (A-U列) 同步成功！(已刷新: ${validCount} 个)`; banner.style.background = "#f6ffed"; banner.style.borderColor = "#b7eb8f"; banner.style.color = "#52c41a"; }
    }

    function fetchCloudMasterDualChannels() {
        const banner = document.getElementById('cloudStat');
        Promise.all([
            fetch(FILE1_URL).then(res => res.text()),
            fetch(FILE2_URL).then(res => res.text())
        ]).then(([txt1, txt2]) => {
            parseDualSKUMaster(txt1, txt2);
            banner.innerText = "⚡ 双通道 SKU 动态活字典挂载完成！";
            banner.style.background = "#f6ffed"; banner.style.borderColor = "#b7eb8f"; banner.style.color = "#52c41a";
        }).catch(err => { banner.innerText = "❌ 联合 SKU 库同步失败"; });
    }

    function parseDualSKUMaster(csv1, csv2) {
        dbMaster = {};
        Papa.parse(csv1, { complete: (res1) => {
            res1.data.forEach((r, i) => {
                if (i > 0 && r[3]) { 
                    let fullSku = r[3].toString().trim().toUpperCase();
                    let gName = r[12] ? r[12].toString().trim() : "N/A";
                    dbMaster[fullSku] = { b: fullSku, c: gName };
                    if (fullSku.includes('~')) { 
                        let shortSku = fullSku.split('~').pop().trim();
                        dbMaster[shortSku] = { b: fullSku, c: gName };
                    }
                }
            });
            Papa.parse(csv2, { complete: (res2) => {
                res2.data.forEach((r, i) => {
                    if (i > 0 && r[7]) { 
                        let fullSku = r[7].toString().trim().toUpperCase();
                        let gName = r[17] ? r[17].toString().trim() : "N/A";
                        dbMaster[fullSku] = { b: fullSku, c: gName };
                        if (fullSku.includes('~')) { 
                            let shortSku = fullSku.split('~').pop().trim();
                            dbMaster[shortSku] = { b: fullSku, c: gName };
                        }
                    }
                });
                refreshHistoricalDataNames();
                if (!isUserTyping) render();
            }});
        }});
    }

    function refreshHistoricalDataNames() {
        if (!data || data.length === 0) return;
        data.forEach(d => { 
            let k = d._originSKU; 
            if (dbMaster[k]) { 
                d.Name = dbMaster[k].c; 
                d.SKU = dbMaster[k].b; 
            } 
        });
    }

    function saveLocalNameOnly() { localStorage.setItem('wh_v820_op', document.getElementById('opName').value); }

    function clearScreenPureHistory() {
        if(confirm("💡 屏幕历史清空确认：\n这会清空您当前手机屏幕上的所有显示框，方便您进行下一批扫描作业。\n⚠️ 注意：后台云端大总账 100% 受到隔离保护，不会受到任何影响。确定执行吗？")) {
            localStorage.setItem("wh_screen_clear_timestamp", Date.now().toString());
            for(let i=1; i<=6; i++) { document.getElementById('s'+i).value = ""; document.getElementById('q'+i).value = ""; }
            document.getElementById('locIn').value = "";
            render();
            alert("✨ 屏幕历史已清理，新一轮扫描盘点无缝开始！");
        }
    }

    function recoverBackup() {
        if(confirm("🔄 确认要恢复您今天录入的所有流水账目吗？\n这会解开本机的分段清屏滤镜，将属于今天的全部协同数据完好无损地拉回屏幕。")) {
            localStorage.setItem("wh_screen_clear_timestamp", "0");
            syncNetworkPool(); 
            alert("✨ 今日数据备份已完整召回恢复！");
        }
    }

    function getFilteredActiveData() {
        let filterTimeMark = Number(localStorage.getItem("wh_screen_clear_timestamp") || "0");
        return data.filter(d => {
            if (d.id && d.id.startsWith("ts_")) {
                let rowTs = parseInt(d.id.split("_")[1]) || 0;
                return rowTs > filterTimeMark; 
            }
            return filterTimeMark === 0;
        });
    }

    function render() {
        const tbody = document.querySelector("#mainTable tbody");
        
        let realSkuTotals = {}; 
        let filteredData = getFilteredActiveData();

        filteredData.forEach(d => { realSkuTotals[d._originSKU] = (realSkuTotals[d._originSKU] || 0) + d.Quantity; });
        let dailyTotals = {}; dbDailyList.forEach(d => dailyTotals[d.sku] = (dailyTotals[d.sku] || 0) + d.plan);
        let allDisplayRows = []; let trackedDailyKeysWithInput = new Set();

        filteredData.forEach(d => {
            let k = d._originSKU; let totalPlanForThisSku = dailyTotals[k]; let skuTotalScanned = realSkuTotals[k] || 0;
            let diffText = "OK"; let isException = false; let rowClass = "";
            if (totalPlanForThisSku === undefined) { diffText = "EXT"; isException = true; rowClass = "row-extra"; } 
            else {
                trackedDailyKeysWithInput.add(k);
                if (skuTotalScanned > totalPlanForThisSku) { diffText = "+" + (skuTotalScanned - totalPlanForThisSku); isException = true; rowClass = "row-over"; } 
                else if (skuTotalScanned < totalPlanForThisSku) { diffText = (skuTotalScanned - totalPlanForThisSku).toString(); isException = true; rowClass = "row-under"; }
            }
            allDisplayRows.push({ id: d.id, _originSKU: k, displaySKU: d._originSKU, location: d.Location, quantity: d.Quantity, diffText: diffText, isException: isException, rowClass: rowClass, hasInput: true, orderWeight: 0 });
        });

        if (dailyActive) {
            dbDailyList.forEach(d => {
                if (trackedDailyKeysWithInput.has(d.sku)) return;
                allDisplayRows.push({ id: "pending_" + d.idx, _originSKU: d.sku, displaySKU: d.sku, location: "—", quantity: 0, diffText: (-d.plan).toString(), isException: true, rowClass: "row-under", hasInput: false, orderWeight: d.idx });
            });
        }

        allDisplayRows.sort((a, b) => { if (a.hasInput !== b.hasInput) return b.hasInput - a.hasInput; if (a.isException !== b.isException) return b.isException - a.isException; if (!a.hasInput) return a.orderWeight - b.orderWeight; return a.displaySKU.localeCompare(b.displaySKU); });
        
        const fragment = document.createDocumentFragment();
        allDisplayRows.forEach(item => {
            let tr = document.createElement('tr'); tr.className = item.rowClass; tr.classList.add(item.hasInput ? "status-active" : "status-pending");
            let qtyCellHtml = item.hasInput ? `<input type="number" class="edit-input" value="${item.quantity}" onchange="updateNetworkRowQty('${item.id}', this.value, ${item.quantity})">` : `<span style="font-size:13px;">0</span> <span style="font-size:10px;color:#aaa;">(Plan:${item.diffText * -1})</span>`;
            let delCellHtml = item.hasInput ? `<button class="del-btn" onclick="deleteNetworkRow(event, '${item.id}')">×</button>` : "—";
            
            tr.innerHTML = `<td class="td-sku">${item.displaySKU}</td><td class="td-loc">${item.location}</td><td>${qtyCellHtml}</td><td style="font-weight:bold; font-size:11px;">${item.diffText}</td><td>${delCellHtml}</td>`;
            fragment.appendChild(tr);
        });

        tbody.innerHTML = "";
        tbody.appendChild(fragment);
    }

    function addBatch() {
        const now = Date.now();
        if (now - lastSubmitTime < 1500) {
            return;
        }
        lastSubmitTime = now;

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = true;
        saveBtn.innerText = "SAVING...";

        unlockAudio();
        let inputLv = document.getElementById('locIn').value.trim(); let upperLv = inputLv.toUpperCase();
        const op = document.getElementById('opName').value.trim();
        if(!op) { 
            alert("⚠️ 拒绝提交！请先在上方输入您的 Operator Name (操作员姓名)，以确保协同溯源安全。"); 
            saveBtn.disabled = false; saveBtn.innerText = "SAVE ALL";
            return; 
        }
        if(!inputLv) { 
            saveBtn.disabled = false; saveBtn.innerText = "SAVE ALL";
            return; 
        }
        if (setLoc.size > 0 && !setLoc.has(upperLv)) { 
            alert(`库位无效！[${inputLv}] 不是合法的云端内置库位。`); 
            saveBtn.disabled = false; saveBtn.innerText = "SAVE ALL";
            return; 
        }

        let finalCorrectLocation = dbLocMap[upperLv] ? dbLocMap[upperLv] : inputLv;
        let batchRowsForGAS = [], temporaryLocalBatch = [], mismatch = false;
        
        const preciseIdTimestamp = Date.now();
        const todayStr = getTodayDateStr();

        for(let i=1; i<=6; i++) {
            const sv = document.getElementById('s'+i).value.trim().toUpperCase(); const qv = parseFloat(document.getElementById('q'+i).value); if(!sv) continue;
            let inDaily = dbDailyList.some(d => d.sku === sv);
            if(dailyActive && !inDaily && forceSKU !== sv) { mismatch = true; forceSKU = sv; break; }
            if(!qv || qv <= 0) { 
                saveBtn.disabled = false; saveBtn.innerText = "SAVE ALL";
                return; 
            }

            let rowUniqueId = "ts_" + preciseIdTimestamp + "_" + i + "_" + Math.random().toString(36).substr(2, 4);
            let finalLongSku = dbMaster[sv] ? dbMaster[sv].b : sv; 
            let finalGoodsName = dbMaster[sv] ? dbMaster[sv].c : "N/A";

            batchRowsForGAS.push([rowUniqueId, sv, finalLongSku, finalGoodsName, qv, finalCorrectLocation, "Patiki Warehouse: " + finalCorrectLocation, todayStr, op]);
            temporaryLocalBatch.push({ id: rowUniqueId, _originSKU: sv, SKU: finalLongSku, Name: finalGoodsName, Quantity: qv, Location: finalCorrectLocation, FullLocation: "Patiki Warehouse: " + finalCorrectLocation, Date: todayStr, Operator: op });
        }

        if(mismatch) { 
            saveBtn.innerText = "SKU NOT IN LIST! TAP AGAIN TO FORCE SAVE"; 
            saveBtn.style.background = "orange"; 
            saveBtn.disabled = false;
            setTimeout(() => { saveBtn.innerText = "SAVE ALL"; saveBtn.style.background = ""; forceSKU = null; }, 3000); 
            return; 
        }
        
        if(batchRowsForGAS.length === 0) {
            saveBtn.disabled = false; saveBtn.innerText = "SAVE ALL";
            return;
        }

        data = [...data, ...temporaryLocalBatch]; render();
        sendJsonpAction({ action: "insert", rowsData: JSON.stringify(batchRowsForGAS) });

        for(let i=1; i<=6; i++) { document.getElementById('s'+i).value = ""; document.getElementById('q'+i).value = ""; }
        document.getElementById('locIn').value = ""; 
        document.getElementById('s1').focus(); 
        forceSKU = null;

        setTimeout(() => {
            saveBtn.disabled = false;
            saveBtn.innerText = "SAVE ALL";
        }, 1000);
    }

    function updateNetworkRowQty(rowId, newQtyStr, oldQty) {
        let n = parseFloat(newQtyStr);
        if (n >= 0) {
            var targetRow = data.find(x => x.id === rowId);
            if (!targetRow) return;

            if (!confirm(`⚠️ 安全确认：\n您确定要将 SKU [${targetRow._originSKU}] 的盘点数量从 [${oldQty}] 变更为 [${n}] 吗？`)) {
                render(); 
                return;
            }

            let op = document.getElementById('opName').value.trim() || "Unknown Operator";
            auditLogPool.push(`${fetchLocalTimeFormatted()} 操作员 [${op}] 调整了库位 [${targetRow.Location}] 的数据 ➔ SKU: [${targetRow._originSKU}], 数量从 [${oldQty}] 变更为 [${n}]`);
            localStorage.setItem('wh_v828_audit_logs', JSON.stringify(auditLogPool));
            
            targetRow.Quantity = n; render(); 
            sendJsonpAction({ action: "updateQty", id: rowId, quantity: n });
        }
    }

    function deleteNetworkRow(e, rowId) {
        if (e) { e.stopPropagation(); e.preventDefault(); }
        
        var targetRow = data.find(x => x.id === rowId);
        if (!targetRow) return;

        if (!confirm(`🚨 毁灭性删除警报！\n您正在试图彻底删除库位 [${targetRow.Location}] 下的 SKU [${targetRow._originSKU}]（数量:${targetRow.Quantity}）！\n此操作将全网删除，确定执行吗？`)) {
            return; 
        }

        let op = document.getElementById('opName').value.trim() || "Unknown Operator";
        auditLogPool.push(`${fetchLocalTimeFormatted()} 🔴警报：操作员 [${op}] 删除了整行物理记录 ➔ 移除库位: [${targetRow.Location}], 受影响SKU: [${targetRow._originSKU}], 数量: [${targetRow.Quantity}]`);
        localStorage.setItem('wh_v828_audit_logs', JSON.stringify(auditLogPool));
        
        data = data.filter(x => x.id !== rowId); render(); 
        sendJsonpAction({ action: "delete", id: rowId });
    }

    function exportCsv() {
        const op = document.getElementById('opName').value.trim() || "User", dateNow = new Date().toISOString().slice(0,10).replace(/-/g, "");
        let scannedGroupsBySku = {};
        
        refreshHistoricalDataNames();

        let activeScopeData = getFilteredActiveData();
        activeScopeData.forEach(d => {
            if (!scannedGroupsBySku[d._originSKU]) scannedGroupsBySku[d._originSKU] = [];
            scannedGroupsBySku[d._originSKU].push({ fullSku: d.SKU, name: d.Name, loc: d.FullLocation, date: d.Date, qty: d.Quantity, operatorName: d.Operator || "Unknown" });
        });

        let dailyGroupsBySku = {}; 
        dbDailyList.forEach(d => { 
            if (!dailyGroupsBySku[d.sku]) dailyGroupsBySku[d.sku] = []; 
            dailyGroupsBySku[d.sku].push({ po: d.po, plan: d.plan }); 
        });
        
        let allSkus = new Set([...Object.keys(scannedGroupsBySku), ...Object.keys(dailyGroupsBySku)]);

        let csvRows = [["SKU", "Full SKU", "Name", "Location", "Date", "Quantity", "Operator", "PO", "Plan Qty"]];
        allSkus.forEach(sku => {
            let scans = scannedGroupsBySku[sku] || [{ fullSku: dbMaster[sku] ? dbMaster[sku].b : sku, name: dbMaster[sku] ? dbMaster[sku].c : "N/A", loc: "N/A", date: getTodayDateStr(), qty: 0, operatorName: op }];
            let plans = dailyGroupsBySku[sku] || [{ po: "N/A", plan: 0 }];

            scans.forEach(s => {
                plans.forEach(p => {
                    csvRows.push([sku, s.fullSku, s.name, s.loc, s.date, s.qty, s.operatorName, p.po, p.plan]);
                });
            });
        });

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + csvRows.map(e => e.map(cell => `"${cell}"`).join(",")).join("\n");
        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Putaway_Export_${op}_${dateNow}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

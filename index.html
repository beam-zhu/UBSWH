<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warehouse V8.20.26 Android</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root { --primary: #1890ff; --success: #52c41a; --danger: #ff4d4f; --extra: #b37feb; --bg: #f5f7fa; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif; margin: 0; background: var(--bg); min-height: 100vh; overflow-x: hidden; }
        
        .main-wrapper { display: flex; flex-direction: column; padding: 8px; gap: 8px; }
        .panel-right { order: 1; width: 100%; } 
        .panel-left { order: 2; width: 100%; display: flex; flex-direction: column; }
        
        @media (min-width: 900px) { 
            .main-wrapper { flex-direction: row; height: 100vh; overflow: hidden; }
            .panel-right { flex: 4; height: 100%; overflow-y: auto; }
            .panel-left { flex: 6; height: 100%; }
        }

        .card { background: white; border-radius: 12px; padding: 12px; border: 1px solid #e8e8e8; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 8px; }
        input { height: 44px; padding: 10px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 16px; width: 100%; background: #fafafa; margin-bottom: 8px; }
        .loc-input { height: 54px; font-size: 22px; border: 2px solid var(--primary); background: #fffbe6; color: #d46b08; }
        
        .sku-row { display: grid; grid-template-columns: 3fr 1.2fr; gap: 8px; margin-bottom: 4px; }
        
        .file-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .file-btn { border: 1px dashed #ccc; padding: 6px; border-radius: 8px; text-align: center; background: #fff; font-size: 10px; position: relative; min-height: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .file-btn input { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; }
        
        .status-tag { font-size: 10px; font-weight: bold; color: #bfbfbf; margin-top: 2px; }
        .ready { color: var(--success); }

        .btn { height: 54px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 18px; width: 100%; }
        .btn-save { background: var(--success); color: white; margin-top: 8px; }
        .btn-export { background: #444; color: white; height: 48px; font-size: 14px; flex-shrink: 0; margin-top: 10px; }

        .table-wrap { flex: 1; overflow-y: auto; background: white; border-radius: 12px; border: 1px solid #e8e8e8; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
        th, td { padding: 8px 2px; border-bottom: 1px solid #f0f0f0; text-align: center; vertical-align: middle; }
        
        .td-sku { word-break: break-all; white-space: normal; text-align: left; padding-left: 4px; font-weight: bold; font-size: 13px; }
        .td-loc { font-size: 11px; color: #666; word-break: break-all; }

        th { background: #fafafa; position: sticky; top: 0; z-index: 10; font-size: 10px; color: #555; }
        
        .row-over { background-color: #fff1f0 !important; color: #cf1322 !important; }
        .row-under { background-color: #e6f7ff !important; color: #096dd9 !important; }
        .row-extra { background-color: #f9f0ff !important; color: #531dab !important; }
        
        .edit-input { width: 100%; padding: 4px; border: 1px solid var(--primary); border-radius: 4px; text-align: center; font-size: 13px; }
        .del-btn { background: #ff7875; color: white; border: none; border-radius: 4px; padding: 4px 8px; font-weight: bold; }
    </style>
</head>
<body onclick="unlockAudio()">

<div class="main-wrapper">
    <div class="panel-right">
        <div class="card">
            <div class="file-grid">
                <div class="file-btn"><span>SKU库</span><input type="file" accept=".csv" onchange="processFile('sku', this.files[0])"><span id="skuStat" class="status-tag">EMPTY</span></div>
                <div class="file-btn"><span>DAILY清单</span><input type="file" accept=".csv" onchange="processFile('check', this.files[0])"><span id="checkStat" class="status-tag">OPTIONAL</span></div>
                <div class="file-btn"><span>库位表</span><input type="file" accept=".csv" onchange="loadLocFile(this.files[0])"><span id="locStat" class="status-tag">EMPTY</span></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 8px;">
                <button onclick="clearCache()" style="font-size:10px; color:red; border:none; background:none; padding:5px;">[清空缓存]</button>
                <button onclick="recoverBackup()" style="font-size:10px; color:blue; border:none; background:none; padding:5px;">[恢复数据]</button>
            </div>
        </div>

        <div class="card">
            <input type="text" id="opName" placeholder="操作员姓名" onchange="saveLocal()">
            <div id="batchContainer">
                <div class="sku-row"><input type="text" id="s1" placeholder="SKU 1"><input type="tel" id="q1" placeholder="Qty"></div>
                <div class="sku-row"><input type="text" id="s2" placeholder="SKU 2"><input type="tel" id="q2" placeholder="Qty"></div>
                <div class="sku-row"><input type="text" id="s3" placeholder="SKU 3"><input type="tel" id="q3" placeholder="Qty"></div>
                <div class="sku-row"><input type="text" id="s4" placeholder="SKU 4"><input type="tel" id="q4" placeholder="Qty"></div>
                <div class="sku-row"><input type="text" id="s5" placeholder="SKU 5"><input type="tel" id="q5" placeholder="Qty"></div>
                <div class="sku-row"><input type="text" id="s6" placeholder="SKU 6"><input type="tel" id="q6" placeholder="Qty"></div>
            </div>
            <input type="text" id="locIn" list="locList" class="loc-input" placeholder="扫入库位 (LOC)">
            <datalist id="locList"></datalist>
            <button class="btn btn-save" id="saveBtn" onclick="addBatch()">SAVE ALL (保存并备份)</button>
        </div>
    </div>

    <div class="panel-left">
        <div class="table-wrap">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th style="width: 30%;">SKU</th>
                        <th style="width: 25%;">Location</th>
                        <th style="width: 18%;">Qty</th>
                        <th style="width: 15%;">状态</th>
                        <th style="width: 12%;">删</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <button class="btn btn-export" onclick="exportCsv()">EXPORT CSV</button>
    </div>
</div>

<script>
    let dbMaster = {}, dbDaily = {}, setLoc = new Set(), data = [];
    let dailyActive = false, audioCtx = null, forceSKU = null;

    function unlockAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    window.onload = () => {
        const cache = localStorage.getItem('wh_v820_data'), op = localStorage.getItem('wh_v820_op');
        if (cache) { data = JSON.parse(cache); render(); }
        if (op) document.getElementById('opName').value = op;
        const cM = localStorage.getItem('csv_master'), cC = localStorage.getItem('csv_check'), cL = localStorage.getItem('csv_loc');
        if(cM) { parseSKU(cM); updateStat('skuStat', true); }
        if(cC) { parseCheck(cC); updateStat('checkStat', true); }
        if(cL) { parseLoc(cL); updateStat('locStat', true); }
        setupEnterKey();
    };

    function processFile(t, f) {
        if(!f) return; const r = new FileReader();
        r.onload = (e) => {
            const txt = e.target.result;
            if(t==='sku') { parseSKU(txt); localStorage.setItem('csv_master', txt); updateStat('skuStat', true); }
            if(t==='check') { parseCheck(txt); localStorage.setItem('csv_check', txt); updateStat('checkStat', true); }
        }; r.readAsText(f);
    }
    function loadLocFile(f) { if(!f) return; const r = new FileReader(); r.onload=(e)=>{parseLoc(e.target.result); localStorage.setItem('csv_loc',e.target.result); updateStat('locStat',true);}; r.readAsText(f); }
    function parseSKU(txt) { Papa.parse(txt, { complete: (res) => { dbMaster = {}; res.data.forEach((r, i) => { if(i>0 && r[0]) dbMaster[r[0].trim().toUpperCase()] = {b:r[1]||"", c:r[2]||""}; }); }}); }
    function parseCheck(txt) { Papa.parse(txt, { complete: (res) => { dbDaily = {}; dailyActive = false; res.data.forEach(r => { if(r[0]) { dbDaily[r[0].trim().toUpperCase()] = parseFloat(r[1]) || 0; dailyActive = true; } }); }}); }
    function parseLoc(txt) { Papa.parse(txt, { complete: (res) => { setLoc.clear(); const dl = document.getElementById('locList'); dl.innerHTML = ""; res.data.forEach(r => r.forEach(c => { if(c && c.toString().trim()) { let v = c.toString().trim().toUpperCase(); setLoc.add(v); let o = document.createElement('option'); o.value = v; dl.appendChild(o); } })); }}); }
    function updateStat(id, r) { const s = document.getElementById(id); s.innerText = r ? "READY" : "EMPTY"; s.className = r ? "status-tag ready" : "status-tag"; }
    function clearCache() { if(confirm("确定清空所有数据？")) { localStorage.clear(); location.reload(); } }
    function recoverBackup() {
        const b = localStorage.getItem('wh_v820_backup');
        if(b) { data = JSON.parse(b); render(); alert("数据已恢复"); }
    }

    function playSound(type) {
        if(!audioCtx) return;
        const g = audioCtx.createGain(); g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.connect(audioCtx.destination);
        const o = audioCtx.createOscillator();
        if(type === 'success') {
            o.type='sine'; o.frequency.setValueAtTime(1000, audioCtx.currentTime);
            o.start(); o.stop(audioCtx.currentTime + 0.1);
        } else if(type === 'warn') {
            o.type='square'; o.frequency.setValueAtTime(440, audioCtx.currentTime);
            o.start(); o.stop(audioCtx.currentTime + 0.3);
        } else {
            o.type='sawtooth'; o.frequency.setValueAtTime(150, audioCtx.currentTime);
            o.start(); o.stop(audioCtx.currentTime + 0.4);
        }
    }

    function addBatch() {
        unlockAudio();
        const lv = document.getElementById('locIn').value.trim().toUpperCase();
        const op = document.getElementById('opName').value.trim();
        if(!lv || !op) { playSound('error'); return; }
        if (setLoc.size > 0 && !setLoc.has(lv)) { playSound('error'); return; }

        let batch = [], any = false, mismatch = false, hasOver = false;
        const dateStr = new Date().toISOString().slice(0,10).replace(/-/g, "");
        let cumulative = {};
        data.forEach(d => cumulative[d._originSKU] = (cumulative[d._originSKU] || 0) + d.Quantity);

        for(let i=1; i<=6; i++) {
            const sv = document.getElementById('s'+i).value.trim().toUpperCase();
            const qv = parseFloat(document.getElementById('q'+i).value);
            if(!sv) continue;
            if(dailyActive && dbDaily[sv] === undefined && forceSKU !== sv) { mismatch = true; forceSKU = sv; break; }
            if(!qv || qv <= 0) { playSound('error'); return; }
            any = true;
            const plan = dbDaily[sv] || 0;
            if(dailyActive && plan > 0 && (cumulative[sv] || 0) + qv > plan) hasOver = true;
            
            batch.push({ 
                id: Date.now()+i, 
                _originSKU: sv, 
                SKU: dbMaster[sv]?dbMaster[sv].b:sv, 
                Name: dbMaster[sv]?dbMaster[sv].c:"N/A", 
                Quantity: qv, 
                Location: lv, 
                FullLocation: "Patiki Warehouse: " + lv,
                Date: dateStr 
            });
        }

        if(mismatch) {
            playSound('error'); const b = document.getElementById('saveBtn'); b.innerText = "不在清单，再点一次保存"; b.style.background = "orange";
            setTimeout(() => { b.innerText = "SAVE ALL (保存并备份)"; b.style.background = ""; forceSKU = null; }, 3000);
            return;
        }
        if(!any) return;
        data = [...batch, ...data]; render(); saveLocal(); 
        playSound(hasOver ? 'warn' : 'success');
        for(let i=1; i<=6; i++) { document.getElementById('s'+i).value = ""; document.getElementById('q'+i).value = ""; }
        document.getElementById('locIn').value = ""; document.getElementById('s1').focus();
        forceSKU = null;
    }

    function render() {
        const tbody = document.querySelector("#mainTable tbody"); tbody.innerHTML = "";
        let cumulative = {};
        const sortedData = [...data].reverse(); 
        sortedData.forEach(d => {
            const plan = dbDaily[d._originSKU];
            cumulative[d._originSKU] = (cumulative[d._originSKU] || 0) + d.Quantity;
            const total = cumulative[d._originSKU];
            let diffText = "OK", rowClass = "";
            if (dailyActive) {
                if (plan === undefined) { diffText = "EXT"; rowClass = "row-extra"; }
                else if (total > plan) {
                    diffText = "+" + (total - plan);
                    rowClass = "row-over";
                } 
                else if (total < plan) { diffText = (total - plan).toString(); rowClass = "row-under"; }
            }

            // 处理 SKU 显示：只显示 ~ 后面的内容
            let displaySKU = d.SKU;
            if (displaySKU.includes('~')) {
                displaySKU = displaySKU.split('~').pop();
            }

            let tr = document.createElement('tr');
            tr.className = rowClass;
            tr.innerHTML = `
                <td class="td-sku">${displaySKU}</td>
                <td class="td-loc">${d.Location}</td>
                <td><input type="number" class="edit-input" value="${d.Quantity}" onchange="updateQty(${d.id},this.value)"></td>
                <td style="font-weight:bold; font-size:11px;">${diffText}</td>
                <td><button class="del-btn" onclick="del(${d.id})">×</button></td>
            `;
            tbody.prepend(tr); 
        });
    }

    function updateQty(id, v) { let n=parseFloat(v); if(n>0){data.find(x=>x.id===id).Quantity=n; render(); saveLocal();} }
    function del(id) { if(confirm("删除？")){data = data.filter(x => x.id !== id); render(); saveLocal();} }
    function saveLocal() { 
        localStorage.setItem('wh_v820_data', JSON.stringify(data)); 
        localStorage.setItem('wh_v820_op', document.getElementById('opName').value); 
        localStorage.setItem('wh_v820_backup', JSON.stringify(data));
    }
    
    function exportCsv() {
        if(!data.length) return;
        let ts = {}; data.forEach(d => ts[d._originSKU] = (ts[d._originSKU] || 0) + d.Quantity);
        const op = document.getElementById('opName').value.trim() || "User";
        const dateNow = new Date().toISOString().slice(0,10).replace(/-/g, "");
        const csv = Papa.unparse([
            ["SKU","Name","BatchSerialNumber","SupplierSKU","ExpiryDate_YYYYMMDD","Quantity","Location","DateReceived_YYYYMMDD","Received","Exception_Note"], 
            ...data.map(d => {
                const p = dbDaily[d._originSKU], t = ts[d._originSKU];
                let note = "";
                if (dailyActive) {
                    if (p === undefined) note = "NOT IN LIST";
                    else if (t > p) note = "+" + (t - p);
                    else if (t < p) note = (t - p);
                }
                return [d.SKU, d.Name, "", "", "", d.Quantity, d.FullLocation, d.Date, "TRUE", note];
            })
        ]);
        const b = new Blob(["\ufeff"+csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement("a"); a.href = URL.createObjectURL(b); 
        a.download = `Putway_${op}_${dateNow}.csv`; a.click();
    }
    function setupEnterKey() {
        const ins = Array.from(document.querySelectorAll('.panel-right input'));
        ins.forEach((input, index) => { input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); (ins[index + 1] || ins[0]).focus(); if(input.id === 'locIn') addBatch(); } }); });
    }
</script>
</body>
</html>
